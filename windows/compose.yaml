services:
  levistone-server:
    image: ghcr.io/liteldev/levistone-server:latest-windows
    environment:
      EULA: TRUE
    ports:
      - 19132:19132/udp
      - 19132:19132/tcp
    volumes:
      - levistone-server-data:C:\data
    stdin_open: true
    tty: true

volumes:
  levistone-server-data:
